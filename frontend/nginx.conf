server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve "backend" through Docker's embedded DNS at request time instead of
    # once at startup, so a recreated backend container (new IP after
    # `docker compose pull && up -d`) doesn't leave nginx proxying to a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # proxy_pass with a variable and no URI part forwards the original request URI unchanged.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
